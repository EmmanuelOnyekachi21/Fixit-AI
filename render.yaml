services:
  # Web Service (Daphne ASGI Server)
  - type: web
    name: fixit-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate --no-input
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: GITHUB_BOT_TOKEN
        sync: false  # Set manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: fixit-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fixit-redis
          property: connectionString

  # Celery Worker
  - type: worker
    name: fixit-celery-worker
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker -l info
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fixit-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fixit-redis
          property: connectionString

databases:
  - name: fixit-db
    databaseName: fixit
    user: fixit_user
    plan: free
    region: oregon

services:
  - type: redis
    name: fixit-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
